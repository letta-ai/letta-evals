# NOTE: This file's name (publish.yml) is significant. The PyPI Trusted
# Publisher for letta-evals matches on the workflow filename, so renaming or
# moving this file (or running the publish job from a different file) will
# break publishing with an `invalid-publisher` error. Keep the publish job in
# this file. See https://docs.pypi.org/trusted-publishers/troubleshooting/
name: Release & Publish

on:
  push:
    branches:
      - main
  workflow_dispatch: {}

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          config-file: .github/release-please-config.json
          manifest-file: .github/.release-please-manifest.json

      # release-please bumps the version in pyproject.toml but doesn't know
      # about uv.lock, which records the project's own version. Refresh the
      # lockfile on the release PR branch right here: the release PR itself
      # never triggers workflows (its branch is pushed with GITHUB_TOKEN), so
      # a pull_request-triggered sync would never fire.
      - uses: actions/checkout@v4
        if: ${{ steps.release.outputs.prs_created == 'true' }}
        with:
          ref: ${{ fromJSON(steps.release.outputs.pr).headBranchName }}

      - uses: astral-sh/setup-uv@v5
        if: ${{ steps.release.outputs.prs_created == 'true' }}

      - name: Sync uv.lock on the release PR
        if: ${{ steps.release.outputs.prs_created == 'true' }}
        run: |
          uv lock
          if ! git diff --quiet uv.lock; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add uv.lock
            git commit -m "chore: Sync uv.lock with release version"
            git push
          fi

  publish-pypi:
    name: Publish to PyPI
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/letta-evals
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      - name: Build package
        run: python -m build

      - name: Check distribution metadata
        run: twine check dist/*

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
